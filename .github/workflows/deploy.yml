name: Food Reservation CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: food-reservation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment: production

    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 25m
          envs: DEPLOY_SHA
          script: |
            set -eu

            cd /opt/food

            echo "Checking repository"

            test -z "$(git status --porcelain)" || {
              echo "Working tree is not clean"
              exit 1
            }

            test "$(git branch --show-current)" = "main" || {
              echo "Server must be on main"
              exit 1
            }

            echo "Fetching source"

            git fetch origin main

            REMOTE_SHA="$(git rev-parse origin/main)"

            if [ "$REMOTE_SHA" != "$DEPLOY_SHA" ]; then
              echo "Remote main changed; skipping old deployment"
              exit 1
            fi

            git merge --ff-only "$DEPLOY_SHA"

            echo "Validating Docker Compose"

            docker compose config --quiet

            echo "Building containers"

            docker compose build

            echo "Starting containers"

            docker compose up -d --no-build --wait --wait-timeout 120

            echo "Container status"

            docker compose ps

            echo "Deployment completed"
