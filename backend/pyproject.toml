[project]
name = "food-reservation-backend"
version = "0.1.0"
description = "Backend API for the food reservation system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django==6.1.3",
    "django-unfold>=0.75,<1",
    "djangorestframework>=3.16,<4",
    "drf-spectacular>=0.29,<1",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    "**/migrations/**",
    ".hypothesis",
    ".venv",
    "static",
    "media",
]
force-exclude = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "PTH",
    "RET",
    "C4",
    "PIE",
    "RUF",
    "S",
    "T20",
]
ignore = [
    "E501",
    "B027",
    "C901",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S106"]
"**/tests.py" = ["S106"]
"**/__init__.py" = ["F401"]
"manage.py" = ["T20"]
"core/apps.py" = ["F401"]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "food"]
section-order = [
    "future",
    "django",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.isort.sections]
django = ["django", "django.*"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

