[project]
name = "food-reservation-backend"
version = "0.1.0"
description = "Backend API for the food reservation system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django==6.1.3",
    "django-unfold>=0.75,<1",
    "djangorestframework>=3.16,<4",
    "drf-spectacular>=0.29,<1",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

# No custom Ruff rules are introduced in this phase. Ruff uses its defaults.

